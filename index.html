<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>小蜜 · 智能客服 Agent</title>
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="apple-touch-icon" href="/icon.svg">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#18181B">
<meta name="description" content="小蜜智能客服：多轮对话、FAQ 检索、意图识别、自动转人工">
<style>
:root{
  --bg:#F7F8FA; --surface:#FFFFFF; --surface-2:#FAFBFC;
  --ink:#18181B; --ink-2:#5B6472; --ink-3:#9CA3AF;
  --line:#E9ECF1; --line-2:#F1F3F6;
  --accent:#4F46E5; --accent-d:#4338CA; --accent-soft:#EEF0FF;
  --ok:#0EA371; --warn:#D97706; --danger:#DC2626;
  --shadow:0 1px 2px rgba(16,24,40,.03), 0 10px 30px rgba(16,24,40,.045);
  --shadow-sm:0 1px 3px rgba(16,24,40,.05);
  --r:14px; --r-sm:10px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Inter","SF Pro Display","Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.6;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font-family:inherit;font-size:max(16px,calc(14px*1))}
button{cursor:pointer;border:none;background:none;color:inherit}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:#DFE3E9;border-radius:6px}::-webkit-scrollbar-track{background:transparent}
.ic{width:18px;height:18px;display:inline-block;vertical-align:middle;flex-shrink:0}
.tabular{font-variant-numeric:tabular-nums}

/* ============ 顶栏 ============ */
.topbar{height:64px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 26px;gap:16px;position:relative;z-index:10}
.brand{display:flex;align-items:center;gap:11px;font-weight:750;font-size:16px;letter-spacing:-.01em;white-space:nowrap}
.brand .logo{width:34px;height:34px;border-radius:10px;background:var(--ink);display:grid;place-items:center;color:#fff;box-shadow:var(--shadow-sm)}
.brand .logo .ic{width:19px;height:19px}
.brand .ver{font-size:10px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:2px 7px;border-radius:6px;letter-spacing:.06em}
.tabs{display:flex;gap:2px;margin-left:auto;background:var(--surface-2);border:1px solid var(--line);padding:4px;border-radius:11px}
.tab{display:flex;align-items:center;gap:7px;padding:7px 16px;border-radius:8px;font-weight:650;color:var(--ink-2);font-size:13px;transition:.18s}
.tab .ic{width:16px;height:16px}
.tab:hover{color:var(--ink)}
.tab.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm)}
.tab.on .ic{color:var(--accent)}
.conn{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink-3);font-weight:600}
.conn i{width:7px;height:7px;border-radius:50%;background:#D1D5DB;display:block;transition:.2s}
.conn.on i{background:var(--ok);box-shadow:0 0 0 3px rgba(14,163,113,.12)}

/* ============ 视图 ============ */
.view{height:calc(100% - 64px);display:none}.view.on{display:flex}

/* ============ 客服：侧栏 ============ */
.chat-wrap{display:flex;width:100%;height:100%}
.side{width:286px;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;flex-shrink:0}
.side-top{padding:18px 16px 12px}
.side-top .row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.side-top .row b{font-size:15px;font-weight:750;letter-spacing:-.01em}
.btn-new{display:flex;align-items:center;gap:5px;background:var(--ink);color:#fff;padding:7px 12px;border-radius:9px;font-size:12px;font-weight:650;transition:.18s}
.btn-new:hover{background:var(--accent)}
.btn-new .ic{width:15px;height:15px}
.search{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:7px 11px;color:var(--ink-3)}
.search:focus-within{border-color:var(--accent);background:#fff}
.search .ic{width:15px;height:15px}
.search input{border:none;outline:none;background:transparent;width:100%;font-size:13px;color:var(--ink)}
.search input::placeholder{color:var(--ink-3)}
.conv-list{flex:1;overflow:auto;padding:2px 10px 14px}
.conv-item{padding:11px 12px;border-radius:10px;margin-bottom:3px;cursor:pointer;transition:.15s;border:1px solid transparent;display:flex;gap:10px;align-items:flex-start}
.conv-item:hover{background:var(--surface-2)}
.conv-item.on{background:var(--accent-soft);border-color:#DCDFFB}
.conv-item .ci{width:32px;height:32px;border-radius:9px;background:var(--surface-2);display:grid;place-items:center;color:var(--ink-3);flex-shrink:0}
.conv-item.on .ci{background:#fff;color:var(--accent)}
.conv-item .ci .ic{width:16px;height:16px}
.conv-item .cb{flex:1;min-width:0}
.conv-item .t{font-weight:650;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px;color:var(--ink)}
.conv-item .m{font-size:11.5px;color:var(--ink-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{font-size:10px;padding:1px 6px;border-radius:5px;font-weight:700;flex-shrink:0;background:var(--accent-soft);color:var(--accent)}
.badge.t{background:#FEF3E2;color:var(--warn)}

/* ============ 客服：聊天 ============ */
.chat-main{flex:1;display:flex;flex-direction:column;min-width:0}
.chat-head{height:66px;padding:0 26px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;flex-shrink:0}
.bot-ava{width:36px;height:36px;border-radius:10px;background:var(--ink);display:grid;place-items:center;color:#fff}
.bot-ava .ic{width:19px;height:19px}
.chat-head .info b{font-size:14.5px;font-weight:700;display:block;line-height:1.3}
.chat-head .info span{font-size:11.5px;color:var(--ok);display:flex;align-items:center;gap:5px}
.chat-head .info span i{width:5px;height:5px;border-radius:50%;background:var(--ok)}
.head-actions{margin-left:auto;display:flex;gap:8px}
.mini-btn{display:flex;align-items:center;gap:6px;padding:7px 13px;border-radius:9px;font-size:12.5px;font-weight:650;border:1px solid var(--line);color:var(--ink-2);background:#fff;transition:.18s}
.mini-btn .ic{width:15px;height:15px}
.mini-btn:hover{border-color:var(--accent);color:var(--accent)}
.mini-btn.human:hover{border-color:var(--warn);color:var(--warn);background:#FFFBF5}
.msgs{flex:1;overflow:auto;padding:28px 8%;background:var(--bg)}
.msg{display:flex;gap:11px;margin-bottom:20px;align-items:flex-start}
.msg .mava{width:32px;height:32px;border-radius:9px;flex-shrink:0;display:grid;place-items:center}
.msg.bot .mava{background:var(--ink);color:#fff}.msg.bot .mava .ic{width:17px;height:17px}
.msg.user{flex-direction:row-reverse}
.msg.user .mava{background:#EDEFF3;color:var(--ink-2)}.msg.user .mava .ic{width:16px;height:16px}
.bubble{max-width:74%;padding:11px 15px;border-radius:13px;font-size:14px;line-height:1.7;word-break:break-word;box-shadow:var(--shadow-sm)}
.msg.bot .bubble{background:var(--surface);border:1px solid var(--line);border-top-left-radius:4px}
.msg.user .bubble{background:var(--ink);color:#fff;border-top-right-radius:4px}
.msg.system{justify-content:center}
.msg.system .bubble{background:#FFFBF5;color:var(--warn);font-size:12px;padding:6px 14px;border-radius:20px;border:1px solid #FBE7C6;box-shadow:none;display:flex;align-items:center;gap:6px}
.msg.system .bubble .ic{width:14px;height:14px}
.meta{font-size:11px;color:var(--ink-3);margin-top:5px;display:flex;gap:8px;align-items:center}
.msg.user .meta{justify-content:flex-end}
.tag-intent{display:inline-flex;align-items:center;gap:3px;background:var(--accent-soft);color:var(--accent);padding:1px 7px;border-radius:5px;font-weight:700;font-size:10.5px}
.tag-intent .ic{width:11px;height:11px}
.typing{display:inline-flex;gap:4px;padding:3px 0}.typing i{width:6px;height:6px;background:var(--accent);border-radius:50%;animation:bounce 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-5px);opacity:1}}
.rate-card{max-width:74%;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:11px;padding:12px 15px;margin:0 0 18px 43px;font-size:12.5px;color:var(--accent);font-weight:650;display:flex;align-items:center;gap:7px;flex-wrap:wrap}

/* ============ 输入区 ============ */
.composer{padding:13px 8% 18px;background:var(--surface);border-top:1px solid var(--line);flex-shrink:0}
.quick{display:flex;gap:7px;overflow:auto;padding-bottom:11px}
.quick button{white-space:nowrap;padding:6px 12px;border-radius:8px;background:var(--surface-2);color:var(--ink-2);font-size:12px;font-weight:600;border:1px solid var(--line);transition:.15s}
.quick button:hover{background:var(--accent-soft);color:var(--accent);border-color:#DCDFFB}
.input-row{display:flex;gap:10px;align-items:flex-end}
.input-row textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:11px;padding:11px 14px;height:46px;max-height:120px;outline:none;font-size:14px;background:var(--surface-2);transition:.18s;line-height:1.5}
.input-row textarea:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px rgba(79,70,229,.07)}
.send-btn{width:46px;height:46px;border-radius:11px;background:var(--ink);color:#fff;display:grid;place-items:center;flex-shrink:0;transition:.18s}
.send-btn:hover{background:var(--accent)}.send-btn:disabled{opacity:.45}
.send-btn .ic{width:19px;height:19px}

/* ============ 管理后台 ============ */
.admin{width:100%;height:100%;overflow:auto;padding:28px 4% 60px}
.admin-inner{max-width:1200px;margin:0 auto}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:10px}
.page-h h2{font-size:23px;font-weight:780;letter-spacing:-.025em}
.page-h .sub{color:var(--ink-3);font-size:12.5px;margin-top:3px}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:16px}
.stat{background:var(--surface);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow);border:1px solid var(--line);transition:.2s}
.stat:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(16,24,40,.07)}
.stat .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.stat .label{font-size:12px;color:var(--ink-2);font-weight:600;display:flex;align-items:center;gap:7px}
.stat .label .ic{width:15px;height:15px;color:var(--accent)}
.stat .ico{width:28px;height:28px;border-radius:8px;background:var(--accent-soft);display:grid;place-items:center;color:var(--accent)}
.stat .ico .ic{width:15px;height:15px}
.stat .num{font-size:30px;font-weight:780;letter-spacing:-.03em;line-height:1.1}
.stat .num small{font-size:13px;color:var(--ink-3);font-weight:600;letter-spacing:0}
.panel{background:var(--surface);border-radius:var(--r);padding:20px 22px;box-shadow:var(--shadow);border:1px solid var(--line);margin-bottom:16px}
.panel h3{font-size:14.5px;font-weight:700;margin-bottom:18px;display:flex;align-items:center;gap:8px;letter-spacing:-.01em}
.panel h3 .ic{width:17px;height:17px;color:var(--accent)}
.panel h3 .hint{font-size:11.5px;color:var(--ink-3);font-weight:500;margin-left:2px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:860px){.two-col{grid-template-columns:1fr}.side{display:none}.msgs{padding:20px 4%}.composer{padding:12px 4%}.topbar{padding:0 14px}.brand .ver{display:none}}

/* 趋势图 */
.trend-chart{display:flex;align-items:flex-end;gap:8px;height:150px;padding-top:6px}
.trend-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-width:0;height:100%}
.trend-bar-wrap{width:100%;flex:1;display:flex;align-items:flex-end;justify-content:center}
.trend-bar{width:min(70%,30px);background:linear-gradient(180deg,#6D66F0,var(--accent));border-radius:5px 5px 0 0;min-height:3px;transition:height .5s cubic-bezier(.2,.8,.2,1);opacity:.85}
.trend-col:hover .trend-bar{opacity:1}
.trend-num{font-size:10.5px;color:var(--ink-2);font-weight:700;margin-bottom:3px}
.trend-label{font-size:10px;color:var(--ink-3);white-space:nowrap}
.trend-sum{display:flex;gap:16px;margin-bottom:14px;font-size:12px;color:var(--ink-2);flex-wrap:wrap}
.trend-sum b{color:var(--ink);font-weight:750}

/* 横条统计 */
.bar-row{display:flex;align-items:center;gap:11px;margin-bottom:11px;font-size:12.5px}
.bar-row .bl{width:70px;color:var(--ink-2);flex-shrink:0;display:flex;align-items:center;gap:5px}
.bar-row .bl .ic{width:13px;height:13px;color:var(--accent)}
.bar-track{flex:1;height:8px;background:var(--surface-2);border-radius:6px;overflow:hidden;border:1px solid var(--line-2)}
.bar-fill{height:100%;background:linear-gradient(90deg,#7C75F3,var(--accent));border-radius:6px;transition:width .5s}
.bar-row .bn{width:34px;text-align:right;font-weight:750;color:var(--ink)}
.stars-mini{color:var(--warn);letter-spacing:1px;display:inline-flex;gap:1px}
.stars-mini .ic{width:13px;height:13px}

/* 表格 */
.filter-chips{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.chip{padding:5px 12px;border-radius:8px;font-size:12px;font-weight:650;color:var(--ink-2);border:1px solid var(--line);background:var(--surface-2)}
.chip:hover{border-color:#D3D0FA;color:var(--accent)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{text-align:left;color:var(--ink-3);font-weight:650;padding:9px 10px;border-bottom:1px solid var(--line);font-size:11px;white-space:nowrap}
.tbl td{padding:11px 10px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr:hover{background:var(--surface-2)}
.tbl .ttl{max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:650}
.pill{padding:2px 8px;border-radius:6px;font-size:10.5px;font-weight:700;background:var(--accent-soft);color:var(--accent);display:inline-flex;align-items:center;gap:3px}
.pill.t{background:#FEF3E2;color:var(--warn)}
.pill.o{background:#E8F8F2;color:var(--ok)}
.pill .ic{width:11px;height:11px}
.link{color:var(--accent);font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:3px}
.link:hover{text-decoration:underline}
.link .ic{width:13px;height:13px}

/* FAQ */
.faq-toolbar{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.faq-toolbar input,.faq-toolbar select{border:1px solid var(--line);border-radius:9px;padding:9px 12px;outline:none;font-size:13px;background:var(--surface-2);color:var(--ink)}
.faq-toolbar input:focus,.faq-toolbar select:focus{border-color:var(--accent);background:#fff}
.btn-solid{display:flex;align-items:center;gap:6px;background:var(--ink);color:#fff;padding:9px 16px;border-radius:9px;font-weight:650;font-size:13px}
.btn-solid:hover{background:var(--accent)}
.btn-solid .ic{width:15px;height:15px}
.faq-item{display:flex;gap:12px;align-items:flex-start;padding:13px 0;border-bottom:1px solid var(--line-2)}
.faq-item:last-child{border-bottom:none}
.faq-item .fbody{flex:1;min-width:0}
.faq-item .fq{font-weight:650;font-size:13.5px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.faq-item .fq .hits{font-size:10.5px;color:var(--ink-3);font-weight:500}
.faq-item .fa{color:var(--ink-2);font-size:12.5px;margin-top:4px;line-height:1.6}
.faq-item .fa-actions{display:flex;gap:6px;flex-shrink:0}
.icon-btn{padding:6px 9px;border-radius:8px;font-size:11.5px;border:1px solid var(--line);color:var(--ink-2);background:var(--surface);display:inline-flex;align-items:center;gap:4px}
.icon-btn .ic{width:13px;height:13px}
.icon-btn:hover{border-color:var(--accent);color:var(--accent)}
.icon-btn.del:hover{border-color:#F4B4B4;color:var(--danger);background:#FEF4F4}

/* 弹框 */
.mask{position:fixed;inset:0;background:rgba(20,22,30,.42);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.mask.on{display:flex;animation:fade .18s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:var(--surface);border-radius:16px;width:100%;max-width:640px;max-height:86vh;display:flex;flex-direction:column;box-shadow:0 24px 70px rgba(16,24,40,.2);border:1px solid var(--line);animation:rise .22s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{transform:translateY(12px) scale(.985);opacity:.6}to{transform:none;opacity:1}}
.modal-h{padding:17px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.modal-h b{font-size:15.5px;font-weight:730}
.x{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--ink-3)}
.x:hover{background:var(--surface-2);color:var(--ink)}
.modal-b{padding:20px 22px;overflow:auto}
.modal-f{padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:9px}
.field{margin-bottom:14px}.field label{display:block;font-size:12.5px;font-weight:650;margin-bottom:6px;color:var(--ink-2)}
.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 12px;outline:none;font-size:13.5px;background:var(--surface-2);color:var(--ink)}
.field input:focus,.field textarea:focus{border-color:var(--accent);background:#fff}
.field textarea{min-height:90px;resize:vertical;line-height:1.6}
.msg-line{padding:11px 0;border-bottom:1px dashed var(--line)}
.msg-line:last-child{border-bottom:none}
.msg-line .who{font-size:11.5px;font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:5px}
.msg-line .who .ic{width:13px;height:13px}
.msg-line .who.u{color:var(--accent)}.msg-line .who.a{color:var(--ok)}.msg-line .who.s{color:var(--warn)}
.msg-line .txt{font-size:13.5px;white-space:pre-wrap;color:var(--ink);line-height:1.7}
.stars-pick{display:flex;gap:8px;justify-content:center}
.star{color:#D9DDE4;transition:.16s;line-height:0;padding:3px;border-radius:8px}
.star .ic{width:30px;height:30px;fill:none;stroke-width:1.6}
.star:hover,.star.on{color:var(--warn);transform:scale(1.1)}
.star.on .ic,.star:hover .ic{fill:currentColor}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(16px);background:var(--ink);color:#fff;padding:10px 20px;border-radius:10px;font-size:13px;font-weight:600;opacity:0;transition:.28s;z-index:200;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{text-align:center;color:var(--ink-3);padding:38px 0;font-size:13px}
.empty .ic{width:26px;height:26px;display:block;margin:0 auto 10px;opacity:.5}
.loading{text-align:center;color:var(--ink-3);padding:38px;font-size:13px}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand"><span class="logo" id="logoIcon"></span> 小蜜 · 智能客服 <span class="ver">AGENT</span></div>
  <div class="tabs">
    <button class="tab on" data-view="chat"><span class="ic-slot" data-ico="chat"></span>在线客服</button>
    <button class="tab" data-view="admin"><span class="ic-slot" data-ico="chart"></span>管理后台</button>
  </div>
  <div class="conn" id="conn"><i></i><span>连接中</span></div>
</div>

<!-- ========== 客服视图 ========== -->
<div class="view on" id="view-chat">
  <div class="chat-wrap">
    <aside class="side">
      <div class="side-top">
        <div class="row"><b>我的咨询</b><button class="btn-new" id="newConv"><span class="ic-slot" data-ico="plus"></span>新会话</button></div>
        <div class="search"><span class="ic-slot" data-ico="search"></span><input id="convSearch" placeholder="搜索会话…"></div>
      </div>

<div class="toast" id="toast"></div>

<script>
/* ============ 图标系统（内联 SVG 线性图标） ============ */
const ICONS={
  bot:'<rect x="4" y="8" width="16" height="12" rx="3"/><path d="M12 8V5"/><circle cx="12" cy="3" r="1"/><circle cx="9" cy="13" r="1"/><circle cx="15" cy="13" r="1"/><path d="M9 17h6"/>',
  chat:'<path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8v.5z"/>',
  chart:'<line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/>',
  plus:'<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
  search:'<circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>',
  headset:'<path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/>',
  star:'<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>',
  send:'<line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>',
  x:'<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
  mail:'<rect x="2" y="4" width="20" height="16" rx="2"/><polyline points="22,6 12,13 2,6"/>',
  users:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
  trend:'<polyline points="3 17 9 11 13 15 21 7"/><polyline points="15 7 21 7 21 13"/>',
  target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/>',
  book:'<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>',
  trash:'<polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
  edit:'<path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4z"/>',
  arrow:'<polyline points="9 18 15 12 9 6"/>',
  check:'<path d="M20 6L9 17l-5-5"/>',
  inbox:'<polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>',
  download:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>',
};
function ico(n,cls=''){return `<svg class="ic ${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]||''}</svg>`}
function starSvg(on){return `<svg class="ic" viewBox="0 0 24 24" fill="${on?'currentColor':'none'}" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">${ICONS.star}</svg>`}
function stars(n){return `<span class="stars-mini">${[1,2,3,4,5].map(i=>starSvg(i<=n)).join('')}</span>`}
const $=id=>document.getElementById(id);
function mountIcons(root=document){root.querySelectorAll('.ic-slot').forEach(el=>{el.outerHTML=ico(el.dataset.ico)})}
mountIcons();
$('logoIcon').innerHTML=ico('bot');
$('headAva').innerHTML=ico('bot');
$('send').innerHTML=ico('send');
document.querySelectorAll('#rateStars').forEach(el=>el.innerHTML=[1,2,3,4,5].map(s=>`<span class="star" data-s="${s}">${starSvg(false)}</span>`).join(''));

/* ============ 全局状态 ============ */
const API="/api";
const S={
  visitor:localStorage.getItem("csa_visitor")||(()=>{const v="v_"+Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem("csa_visitor",v);return v})(),
  convId:null,conversations:[],messages:[],rating:null,sending:false,
  adminStatus:"",editingFaq:null,faqCat:"",
};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=ts=>{if(!ts)return"";const d=new Date(ts);return`${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`};
const intentName=i=>({refund:"退款",order:"查询订单",tech:"技术支持",other:"其他"})[i]||i;
const intentIco=i=>({refund:"mail",order:"inbox",tech:"target",other:"chat"})[i]||"chat";
const catName=c=>({refund:"退款",order:"订单",tech:"技术",general:"通用"})[c]||c;
function toast(msg){const t=$("toast");t.textContent=msg;t.classList.add("on");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("on"),2200)}
function setConn(on){const c=$("conn");c.classList.toggle("on",on);c.querySelector("span").textContent=on?"云端已连接":"连接失败"}
async function api(path,opt={}){
  try{
    const r=await fetch(API+path,{headers:{"Content-Type":"application/json"},...opt});
    const j=await r.json();
    if(!r.ok||j.ok===false)throw new Error(j.error||"请求失败");
    setConn(true);return j;
  }catch(e){setConn(false);throw e}
}

/* ============ 视图切换 ============ */
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));
  document.querySelectorAll(".view").forEach(x=>x.classList.remove("on"));
  t.classList.add("on");$("view-"+t.dataset.view).classList.add("on");
  if(t.dataset.view==="admin")loadAdmin();
});

/* ============ 会话列表 ============ */
async function loadConversations(){
  $("convList").innerHTML='<div class="loading">加载中…</div>';
  try{
    const j=await api("/conversations?visitor="+encodeURIComponent(S.visitor));
    S.conversations=j.conversations;renderConvList();
    if(S.conversations.length&&!S.convId)openConv(S.conversations[0].id);
    else if(!S.conversations.length)createConv(true);
  }catch(e){$("convList").innerHTML='<div class="empty">'+ico("chat")+'云端连接失败<br><span style="font-size:11px">请检查网络后刷新</span></div>'}
}
function renderConvList(){
  const q=($("convSearch").value||"").trim().toLowerCase();
  const list=S.conversations.filter(c=>!q||(c.title||"").toLowerCase().includes(q)||c.intent.includes(q));
  if(!list.length){$("convList").innerHTML='<div class="empty">'+ico("inbox")+(S.conversations.length?'没有匹配的会话':'还没有咨询记录')+'</div>';return}
  $("convList").innerHTML=list.map(c=>{
    const badge=c.status==="transferred"?'<span class="badge t">人工</span>':(c.intent&&c.intent!=="other"?`<span class="badge">${intentName(c.intent)}</span>`:"");
    return `<div class="conv-item ${c.id===S.convId?"on":""}" data-id="${c.id}">
      <div class="ci">${ico(intentIco(c.intent))}</div>
      <div class="cb"><div class="t">${badge}${esc(c.title||"新咨询")}</div><div class="m">${fmt(c.updated)} · ${c.status==="transferred"?"已转人工":"智能客服"}</div></div>
    </div>`;
  }).join("");
  document.querySelectorAll(".conv-item").forEach(el=>el.onclick=()=>openConv(el.dataset.id));
}
$("convSearch").oninput=renderConvList;
async function createConv(silent){
  try{
    const j=await api("/conversations",{method:"POST",body:JSON.stringify({visitor:S.visitor,title:"新咨询"})});
    S.convId=j.id;await loadConversations();openConv(j.id);
    if(!silent)toast("已创建新会话");
  }catch(e){toast("创建失败："+e.message)}
}
async function openConv(id){
  S.convId=id;renderConvList();$("msgs").innerHTML='<div class="loading">加载消息…</div>';
  try{
    const j=await api("/messages?conv="+encodeURIComponent(id));
    S.messages=j.messages;S.rating=j.rating;renderMessages();
  }catch(e){$("msgs").innerHTML='<div class="empty">'+ico("chat")+'加载失败</div>'}
}
function renderMessages(){
  if(!S.messages.length){$("msgs").innerHTML='<div class="empty">'+ico("chat")+'开始咨询吧</div>';return}
  $("msgs").innerHTML=S.messages.map(m=>{
    if(m.role==="system")return`<div class="msg system"><div class="bubble">${ico("headset")}${esc(m.content)}</div></div>`;
    const isU=m.role==="user";
    const tag=m.intent&&m.intent!=="other"&&isU?`<span class="tag-intent">${ico(intentIco(m.intent))}${intentName(m.intent)}</span>`:"";
    return`<div class="msg ${isU?"user":"bot"}">
      <div class="mava">${ico(isU?"users":"bot")}</div>
      <div><div class="bubble">${esc(m.content)}</div>
      <div class="meta">${tag}<span>${fmt(m.created)}</span>${m.source==="transfer"?'<span style="color:var(--warn)">已转人工</span>':""}</div></div>
    </div>`;
  }).join("")+(S.rating?`<div class="rate-card">${ico("check")}您已评分 ${stars(S.rating.score)} · 感谢您的反馈</div>`:"");
  scrollBottom();
}
function scrollBottom(){const m=$("msgs");m.scrollTop=m.scrollHeight}

/* ============ 发消息 ============ */
async function send(text){
  if(S.sending||!text.trim()||!S.convId)return;
  S.sending=true;$("send").disabled=true;
  S.messages.push({id:"tmp_"+Date.now(),role:"user",content:text.trim(),intent:"",source:"",created:Date.now()});
  renderMessages();$("input").value="";
  $("msgs").insertAdjacentHTML("beforeend",`<div class="msg bot" id="typing"><div class="mava">${ico("bot")}</div><div><div class="bubble"><span class="typing"><i></i><i></i><i></i></span></div></div></div>`);
  scrollBottom();
  try{
    const j=await api("/chat",{method:"POST",body:JSON.stringify({conv:S.convId,text:text.trim()})});
    $("typing")?.remove();
    S.messages[S.messages.length-1].intent=j.intent;
    S.messages.push({id:"a_"+Date.now(),role:"agent",content:j.reply,intent:j.intent,source:j.source,created:Date.now()});
    renderMessages();
    if(j.transferred)toast("已为您转接人工客服");
    loadConversations();
  }catch(e){$("typing")?.remove();toast("发送失败："+e.message)}
  finally{S.sending=false;$("send").disabled=false;$("input").focus()}
}
$("send").onclick=()=>send($("input").value);
$("input").onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send($("input").value)}};
document.querySelectorAll("#quick button").forEach(b=>b.onclick=()=>send(b.textContent));
$("newConv").onclick=()=>createConv(false);
$("btnHuman").onclick=async()=>{if(!S.convId)return;try{await api("/transfer",{method:"POST",body:JSON.stringify({conv:S.convId})});toast("已转人工，请稍候");openConv(S.convId);loadConversations()}catch(e){toast(e.message)}};
$("btnRate").onclick=()=>{if(!S.convId)return toast("请先选择一个会话");$("rateMask").classList.add("on");selStars(0)};

/* ============ 评价 ============ */
let selScore=0;
function selStars(n){selScore=n;document.querySelectorAll("#rateStars .star").forEach(s=>{const on=+s.dataset.s<=n;s.classList.toggle("on",on);s.innerHTML=starSvg(on)})}
document.querySelectorAll("#rateStars .star").forEach(s=>s.onclick=()=>selStars(+s.dataset.s));
$("rateSubmit").onclick=async()=>{
  if(!selScore)return toast("请选择星级");
  try{
    await api("/rating",{method:"POST",body:JSON.stringify({conv:S.convId,score:selScore,comment:$("rateComment").value})});
    $("rateMask").classList.remove("on");toast("评价成功，感谢您的反馈！");openConv(S.convId);
  }catch(e){toast(e.message)}
};

/* ============ 管理后台 ============ */
async function loadAdmin(){await Promise.all([loadStats(),loadAdminConvs(),loadFaqs()])}
async function loadStats(){
  try{
    const j=await api("/admin/stats");
    const rate=j.ratingCount?`${j.avgRating} <small>/ 5 · ${j.ratingCount}份</small>`:"—";
    const cards=[
      ["chat","总会话数",j.totalConversations],
      ["mail","消息总数",j.totalMessages],
      ["headset","转人工数",j.transferred],
      ["star","平均满意度",rate],
    ];
    $("statGrid").innerHTML=cards.map(([ic,label,num])=>`<div class="stat">
      <div class="top"><span class="label">${ico(ic)}${label}</span><span class="ico">${ico(ic)}</span></div>
      <div class="num tabular">${num}</div></div>`).join("");
    const daily=j.daily||[];
    const total=daily.reduce((a,b)=>a+b.n,0),max=Math.max(1,...daily.map(x=>x.n));
    $("trendSum").innerHTML=`<span>近14天会话 <b>${total}</b></span><span>日均 <b>${daily.length?(total/daily.length).toFixed(1):0}</b></span><span>峰值 <b>${max}</b></span>`;
    $("trend").innerHTML=daily.length?`<div class="trend-chart">${daily.map(x=>`<div class="trend-col" title="${x.d}：${x.n} 个会话">
      <div class="trend-num">${x.n||""}</div><div class="trend-bar-wrap"><div class="trend-bar" style="height:${Math.max(3,x.n/max*100)}%"></div></div>
      <div class="trend-label">${x.d.slice(5)}</div></div>`).join("")}</div>`:'<div class="empty">'+ico("trend")+'暂无趋势数据</div>';
    const imax=Math.max(1,...j.intents.map(x=>x.n));
    $("intentBars").innerHTML=j.intents.length?j.intents.map(x=>`<div class="bar-row">
      <span class="bl">${ico(intentIco(x.intent))}${intentName(x.intent)}</span>
      <div class="bar-track"><div class="bar-fill" style="width:${x.n/imax*100}%"></div></div><span class="bn tabular">${x.n}</span></div>`).join(""):'<div class="empty">'+ico("target")+'暂无数据</div>';
    const rmax=Math.max(1,...j.ratingDist.map(x=>x.n));
    $("ratingBars").innerHTML=j.ratingDist.length?j.ratingDist.map(x=>`<div class="bar-row">
      <span class="bl">${stars(x.score)}</span>
      <div class="bar-track"><div class="bar-fill" style="width:${x.n/rmax*100}%"></div></div><span class="bn tabular">${x.n}</span></div>`).join(""):'<div class="empty">'+ico("star")+'暂无评价</div>';
  }catch(e){$("statGrid").innerHTML='<div class="empty">统计加载失败</div>'}
}
document.querySelectorAll("#convFilter .chip").forEach(c=>c.onclick=()=>{
  document.querySelectorAll("#convFilter .chip").forEach(x=>x.classList.remove("on"));
  c.classList.add("on");S.adminStatus=c.dataset.status;loadAdminConvs();
});
async function loadAdminConvs(){
  try{
    const q=S.adminStatus?`?status=${S.adminStatus}`:"";
    const j=await api("/admin/conversations"+q);
    $("convTable").innerHTML=j.conversations.length?j.conversations.map(c=>{
      const st=c.status==="transferred"?'<span class="pill t">'+ico("headset")+'已转人工</span>':(c.status==="closed"?'<span class="pill">'+ico("check")+'已关闭</span>':'<span class="pill o">'+ico("chat")+'进行中</span>');
      const sc=c.score?stars(c.score):'<span style="color:var(--ink-3)">—</span>';
      return`<tr><td class="ttl">${esc(c.title||"新咨询")}</td><td>${esc(String(c.visitor).slice(0,12))}</td>
        <td><span class="pill">${ico(intentIco(c.intent))}${intentName(c.intent)}</span></td><td class="tabular">${c.msg_count}</td><td>${st}</td><td>${sc}</td>
        <td class="tabular">${fmt(c.updated)}</td><td><span class="link" data-detail="${c.id}">查看${ico("arrow")}</span></td></tr>`;
    }).join(""):'<tr><td colspan="8" class="empty">'+ico("inbox")+'暂无对话记录</td></tr>';
    document.querySelectorAll("[data-detail]").forEach(el=>el.onclick=()=>openDetail(el.dataset.detail));
  }catch(e){$("convTable").innerHTML='<tr><td colspan="8" class="empty">加载失败</td></tr>'}
}
async function openDetail(id){
  try{
    const j=await api("/messages?conv="+encodeURIComponent(id));
    $("detailTitle").textContent=j.conversation.title||"对话详情";
    const status=j.conversation.status==="transferred"?'<span class="pill t">'+ico("headset")+'已转人工</span>':'<span class="pill o">'+ico("chat")+'智能客服</span>';
    let html=`<div style="margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">${status}<span style="color:var(--ink-3);font-size:11.5px">访客 ${esc(j.conversation.visitor)} · ${fmt(j.conversation.created)}</span></div>`;
    html+=j.messages.map(m=>{
      const who=m.role==="user"?`<span class="who u">${ico("users")}访客</span>`:m.role==="agent"?`<span class="who a">${ico("bot")}小蜜${m.source==="faq"?" · FAQ":m.source==="transfer"?" · 转人工":""}</span>`:`<span class="who s">${ico("headset")}系统</span>`;
      return`<div class="msg-line">${who}<div class="txt">${esc(m.content)}</div></div>`;
    }).join("");
    if(j.rating)html+=`<div style="margin-top:16px;padding:12px 14px;background:var(--accent-soft);border-radius:10px;font-size:12.5px;display:flex;align-items:center;gap:9px;color:var(--accent);font-weight:650;flex-wrap:wrap">满意度 ${stars(j.rating.score)}${j.rating.comment?" · "+esc(j.rating.comment):""}</div>`;
    $("detailBody").innerHTML=html;$("detailMask").classList.add("on");
  }catch(e){toast(e.message)}
}

/* ============ FAQ 管理 ============ */
let allFaqs=[];
function renderFaqList(){
  const cat=S.faqCat||"";
  const list=allFaqs.filter(f=>!cat||f.category===cat);
  $("faqList").innerHTML=list.length?list.map(f=>`<div class="faq-item" data-faq="${f.id}">
    <div class="fbody"><div class="fq"><span class="pill">${catName(f.category)}</span>${esc(f.question)}<span class="hits">命中 ${f.hits||0} 次</span></div><div class="fa">${esc(f.answer)}</div></div>
    <div class="fa-actions"><button class="icon-btn" data-edit="${f.id}">${ico("edit")}编辑</button><button class="icon-btn del" data-del="${f.id}">${ico("trash")}删除</button></div>
  </div>`).join(""):'<div class="empty">'+ico("book")+(allFaqs.length?'该分类暂无 FAQ':'暂无 FAQ')+'</div>';
  document.querySelectorAll("[data-del]").forEach(el=>el.onclick=async()=>{
    if(!confirm("确定删除这条 FAQ？"))return;
    try{await api("/admin/faq/"+el.dataset.del,{method:"DELETE"});toast("已删除");loadFaqs()}catch(e){toast(e.message)}
  });
  document.querySelectorAll("[data-edit]").forEach(el=>el.onclick=()=>openFaqEdit(el.dataset.edit));
}
async function loadFaqs(){
  try{
    const j=await api("/faqs");allFaqs=j.faqs;renderFaqList();
  }catch(e){$("faqList").innerHTML='<div class="empty">加载失败</div>'}
}
document.querySelectorAll("#faqFilter .chip").forEach(c=>c.onclick=()=>{
  document.querySelectorAll("#faqFilter .chip").forEach(x=>x.classList.remove("on"));
  c.classList.add("on");S.faqCat=c.dataset.cat;renderFaqList();
});
$("faqAdd").onclick=async()=>{
  const q=$("faqQ").value.trim(),a=$("faqA").value.trim(),c=$("faqCat").value;
  if(!q||!a)return toast("请填写问题和答案");
  const kw=[...new Set((q.match(/[\u4e00-\u9fa5]{2,4}/g)||[]).slice(0,6))];
  try{await api("/admin/faq",{method:"POST",body:JSON.stringify({question:q,answer:a,category:c,keywords:kw})});
    $("faqQ").value="";$("faqA").value="";toast("FAQ 已添加");loadFaqs();
  }catch(e){toast(e.message)}
};
async function openFaqEdit(id){
  try{
    const j=await api("/faqs");
    const item=j.faqs.find(x=>x.id===id);if(!item)return;
    S.editingFaq=item;
    $("efQ").value=item.question;$("efA").value=item.answer;
    $("efCat").value=item.category||"general";
    $("faqMask").classList.add("on");
  }catch(e){toast(e.message)}
}
$("faqSave").onclick=async()=>{
  if(!S.editingFaq)return;
  const q=$("efQ").value.trim(),a=$("efA").value.trim();
  if(!q||!a)return toast("请填写问题和答案");
  const kw=[...new Set((q.match(/[\u4e00-\u9fa5]{2,4}/g)||[]).slice(0,6))];
  try{
    await api("/admin/faq/"+S.editingFaq.id,{method:"PUT",body:JSON.stringify({question:q,answer:a,category:$("efCat").value,keywords:kw,enabled:true})});
    $("faqMask").classList.remove("on");toast("FAQ 已更新");loadFaqs();
  }catch(e){toast(e.message)}
};

/* ============ 导出 CSV ============ */
$("btnExport").onclick=async()=>{
  try{
    const j=await api("/admin/conversations?limit=1000");
    if(!j.conversations.length)return toast("暂无对话记录可导出");
    const q=s=>`"${String(s??"").replace(/"/g,'""')}"`;
    const rows=[["会话ID","标题","访客","意图","消息数","状态","评分","更新时间"].map(q).join(",")];
    for(const c of j.conversations){
      rows.push([c.id,c.title,c.visitor,intentName(c.intent),c.msg_count,
        {open:"进行中",transferred:"已转人工",closed:"已关闭"}[c.status]||c.status,
        c.score||"",new Date(c.updated).toLocaleString("zh-CN")].map(q).join(","));
    }
    const blob=new Blob(["\uFEFF"+rows.join("\r\n")],{type:"text/csv;charset=utf-8"});
    const url=URL.createObjectURL(blob),a=document.createElement("a");
    a.href=url;a.download=`客服对话记录_${new Date().toISOString().slice(0,10)}.csv`;
    document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
    toast(`已导出 ${j.conversations.length} 条会话`);
  }catch(e){toast("导出失败："+e.message)}
};

/* ============ 弹框关闭 ============ */
document.querySelectorAll("[data-close]").forEach(el=>{el.innerHTML=ico("x");el.onclick=()=>el.closest(".mask").classList.remove("on")});
document.querySelectorAll(".mask").forEach(m=>m.onclick=e=>{if(e.target===m)m.classList.remove("on")});

/* ============ 启动 ============ */
loadConversations();
// 注册 PWA Service Worker（离线可访问外壳，API 永不缓存）
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(()=>{}))}
</script>
