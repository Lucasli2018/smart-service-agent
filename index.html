<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>小蜜智能客服 · Agent</title>
<style>
:root{
  --coral:#FF7A59; --coral-d:#F2603E; --coral-l:#FFF0EA; --coral-soft:#FFE2D6;
  --ink:#2b2b33; --sub:#7b7b87; --line:#f0e9e5; --bg:#FFF9F6; --card:#fff;
  --ok:#3bb88b; --warn:#f5a623; --shadow:0 8px 30px rgba(242,96,62,.10);
  --avatar-bot:linear-gradient(135deg,#FF8A66,#F2603E);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6;overflow:hidden}
button,input,textarea{font-family:inherit;font-size:max(16px,calc(15px*1))}
button{cursor:pointer;border:none;background:none;color:inherit}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:#e5ddd8;border-radius:6px}

/* ===== 顶栏 ===== */
.topbar{height:60px;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 20px;gap:14px;position:relative;z-index:10}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;color:var(--coral-d)}
.brand .logo{width:36px;height:36px;border-radius:12px;background:var(--avatar-bot);display:grid;place-items:center;color:#fff;font-size:20px;box-shadow:0 4px 12px rgba(242,96,62,.3)}
.brand small{font-size:11px;color:var(--sub);font-weight:600;background:var(--coral-l);padding:2px 8px;border-radius:10px}
.tabs{display:flex;gap:4px;margin-left:auto;background:var(--bg);padding:4px;border-radius:12px}
.tab{padding:8px 18px;border-radius:9px;font-weight:700;color:var(--sub);font-size:14px;transition:.2s}
.tab.on{background:var(--coral);color:#fff;box-shadow:0 4px 12px rgba(255,122,89,.35)}
.cloud-dot{width:8px;height:8px;border-radius:50%;background:#ddd;display:inline-block;margin-right:5px}
.cloud-dot.on{background:var(--ok)}

/* ===== 视图容器 ===== */
.view{height:calc(100% - 60px);display:none}
.view.on{display:flex}

/* ===== 客服视图 ===== */
.chat-wrap{display:flex;width:100%;height:100%}
.side{width:280px;border-right:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;flex-shrink:0}
.side-h{padding:16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.side-h b{font-size:15px}
.btn-new{background:var(--coral);color:#fff;padding:7px 14px;border-radius:10px;font-size:13px;font-weight:700}
.btn-new:hover{background:var(--coral-d)}
.conv-list{flex:1;overflow:auto;padding:8px}
.conv-item{padding:12px;border-radius:12px;margin-bottom:4px;cursor:pointer;transition:.15s;border:1.5px solid transparent}
.conv-item:hover{background:var(--bg)}
.conv-item.on{background:var(--coral-l);border-color:var(--coral-soft)}
.conv-item .t{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.conv-item .m{font-size:12px;color:var(--sub);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{font-size:10px;padding:1px 7px;border-radius:8px;font-weight:700;flex-shrink:0}
.badge.transfer{background:#FFF1E6;color:#E8853B}
.badge.other{background:var(--coral-l);color:var(--coral-d)}

.chat-main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
.chat-head{padding:12px 22px;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.bot-ava{width:40px;height:40px;border-radius:50%;background:var(--avatar-bot);display:grid;place-items:center;color:#fff;font-size:22px;box-shadow:0 4px 12px rgba(242,96,62,.3)}
.chat-head .info b{font-size:16px}.chat-head .info span{font-size:12px;color:var(--ok)}
.chat-head .head-actions{margin-left:auto;display:flex;gap:8px}
.mini-btn{padding:7px 13px;border-radius:9px;font-size:13px;font-weight:700;border:1.5px solid var(--line);color:var(--sub)}
.mini-btn:hover{border-color:var(--coral);color:var(--coral)}
.mini-btn.human{background:#FFF4E8;border-color:#FFE0BD;color:#E8853B}

.msgs{flex:1;overflow:auto;padding:24px 8%;background:var(--bg)}
.msg{display:flex;gap:10px;margin-bottom:18px;align-items:flex-start}
.msg .mava{width:34px;height:34px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;font-size:18px}
.msg.bot .mava{background:var(--avatar-bot);color:#fff}
.msg.user{flex-direction:row-reverse}
.msg.user .mava{background:#EDEAF0;color:#888}
.bubble{max-width:72%;padding:11px 15px;border-radius:16px;font-size:14.5px;line-height:1.65;word-break:break-word;box-shadow:0 2px 8px rgba(0,0,0,.03)}
.msg.bot .bubble{background:var(--card);border-top-left-radius:4px;border:1px solid var(--line)}
.msg.user .bubble{background:var(--coral);color:#fff;border-top-right-radius:4px}
.msg.system{justify-content:center}
.msg.system .bubble{background:#FFF4E8;color:#E8853B;font-size:12.5px;padding:6px 14px;border-radius:20px}
.meta{font-size:11px;color:#b9b3ae;margin-top:4px;display:flex;gap:8px;align-items:center}
.msg.user .meta{justify-content:flex-end}
.tag-intent{background:var(--coral-l);color:var(--coral-d);padding:1px 7px;border-radius:8px;font-weight:700}
.typing{display:inline-flex;gap:4px;padding:4px 0}
.typing i{width:7px;height:7px;background:var(--coral);border-radius:50%;animation:bounce 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-6px);opacity:1}}

/* 评价卡 */
.rate-card{max-width:72%;background:var(--card);border:1.5px solid var(--coral-soft);border-radius:16px;padding:14px 16px;margin:0 0 18px 44px}
.rate-card .q{font-weight:700;font-size:14px;margin-bottom:8px}
.stars{display:flex;gap:6px}
.star{font-size:26px;color:#ddd;transition:.15s;line-height:1}
.star:hover,.star.on{color:var(--warn);transform:scale(1.12)}
.rate-done{font-size:13px;color:var(--ok);font-weight:700}

/* 输入区 */
.composer{padding:14px 8%;background:var(--card);border-top:1px solid var(--line)}
.quick{display:flex;gap:8px;overflow:auto;padding-bottom:10px}
.quick button{white-space:nowrap;padding:6px 12px;border-radius:16px;background:var(--coral-l);color:var(--coral-d);font-size:12.5px;font-weight:600;border:1px solid var(--coral-soft)}
.quick button:hover{background:var(--coral-soft)}
.input-row{display:flex;gap:10px;align-items:flex-end}
.input-row textarea{flex:1;resize:none;border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;height:46px;max-height:120px;outline:none;font-size:15px;background:var(--bg)}
.input-row textarea:focus{border-color:var(--coral)}
.send-btn{width:46px;height:46px;border-radius:12px;background:var(--coral);color:#fff;font-size:20px;display:grid;place-items:center;flex-shrink:0;box-shadow:0 4px 12px rgba(255,122,89,.3)}
.send-btn:hover{background:var(--coral-d)}.send-btn:disabled{opacity:.5}

/* ===== 管理后台 ===== */
.admin{width:100%;height:100%;overflow:auto;padding:26px 4%;background:var(--bg)}
.admin-inner{max-width:1180px;margin:0 auto}
.admin h2{font-size:22px;margin-bottom:4px}
.admin .sub{color:var(--sub);font-size:13px;margin-bottom:22px}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:22px}
.stat{background:var(--card);border-radius:16px;padding:18px 20px;box-shadow:var(--shadow);border:1px solid var(--line)}
.stat .label{font-size:12.5px;color:var(--sub);display:flex;align-items:center;gap:6px}
.stat .num{font-size:30px;font-weight:800;color:var(--coral-d);margin-top:6px}
.stat .num small{font-size:14px;color:var(--sub)}
.panel{background:var(--card);border-radius:16px;padding:20px 22px;box-shadow:var(--shadow);border:1px solid var(--line);margin-bottom:18px}
.panel h3{font-size:16px;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:820px){.two-col{grid-template-columns:1fr}.side{display:none}.msgs{padding:18px 4%}.composer{padding:12px 4%}}

/* 条形统计 */
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:13px}
.bar-row .bl{width:64px;color:var(--sub);flex-shrink:0}
.bar-track{flex:1;height:10px;background:var(--bg);border-radius:8px;overflow:hidden}
.bar-fill{height:100%;background:linear-gradient(90deg,#FF9B7A,var(--coral));border-radius:8px;transition:width .5s}
.bar-row .bn{width:42px;text-align:right;font-weight:700;color:var(--ink)}
.stars-mini{color:var(--warn);letter-spacing:1px}

/* 表格 */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;color:var(--sub);font-weight:600;padding:9px 10px;border-bottom:1px solid var(--line);font-size:12px}
.tbl td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:hover td{background:var(--bg)}
.tbl .ttl{max-width:230px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.pill{padding:2px 9px;border-radius:10px;font-size:11px;font-weight:700;background:var(--coral-l);color:var(--coral-d)}
.pill.t{background:#FFF1E6;color:#E8853B}
.pill.o{background:#EAF7F1;color:var(--ok)}
.link{color:var(--coral);font-weight:700;cursor:pointer}
.link:hover{text-decoration:underline}
.empty{text-align:center;color:#bbb;padding:36px 0;font-size:14px}

/* FAQ 管理 */
.faq-toolbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.faq-toolbar input,.faq-toolbar select{border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;outline:none;font-size:14px;background:var(--bg)}
.faq-toolbar input:focus{border-color:var(--coral)}
.btn-solid{background:var(--coral);color:#fff;padding:9px 18px;border-radius:10px;font-weight:700;font-size:14px}
.btn-solid:hover{background:var(--coral-d)}
.faq-item{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.faq-item .fbody{flex:1}
.faq-item .fq{font-weight:700;font-size:14px}
.faq-item .fa{color:var(--sub);font-size:13px;margin-top:3px}
.faq-item .fa-actions{display:flex;gap:8px;flex-shrink:0}
.icon-btn{padding:5px 10px;border-radius:8px;font-size:12px;border:1px solid var(--line);color:var(--sub)}
.icon-btn.del:hover{border-color:#e74c3c;color:#e74c3c}

/* 弹框 */
.mask{position:fixed;inset:0;background:rgba(30,25,22,.45);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.mask.on{display:flex}
.modal{background:var(--card);border-radius:18px;width:100%;max-width:620px;max-height:86vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal-h{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.modal-h b{font-size:17px}.x{font-size:22px;color:var(--sub);line-height:1}
.modal-b{padding:20px 22px;overflow:auto}
.modal-f{padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
.field input,.field textarea,.field select{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;outline:none;font-size:14px;background:var(--bg)}
.field textarea{min-height:80px;resize:vertical}
.field input:focus,.field textarea:focus{border-color:var(--coral)}
.msg-line{padding:10px 0;border-bottom:1px dashed var(--line)}
.msg-line .who{font-size:12px;font-weight:700;margin-bottom:3px}
.msg-line .who.u{color:var(--coral-d)}.msg-line .who.a{color:var(--ok)}.msg-line .who.s{color:var(--warn)}
.msg-line .txt{font-size:14px;white-space:pre-wrap}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 22px;border-radius:12px;font-size:14px;opacity:0;transition:.3s;z-index:200;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.loading{text-align:center;color:var(--sub);padding:40px}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand"><span class="logo">🐱</span> 小蜜智能客服 <small>AGENT</small></div>
  <div class="tabs">
    <button class="tab on" data-view="chat">💬 在线客服</button>
    <button class="tab" data-view="admin">📊 管理后台</button>
  </div>
  <span class="cloud-dot" id="cloudDot" title="云端连接状态"></span>
</div>

<!-- ========== 客服视图 ========== -->
<div class="view on" id="view-chat">
  <div class="chat-wrap">
    <aside class="side">
      <div class="side-h"><b>我的咨询</b><button class="btn-new" id="newConv">＋ 新会话</button></div>
      <div class="conv-list" id="convList"><div class="loading">加载中…</div></div>
    </aside>
    <main class="chat-main" id="chatMain">
      <div class="chat-head">
        <div class="bot-ava">🐱</div>
        <div class="info"><b>智能客服小蜜</b> <span>● 在线</span></div>
        <div class="head-actions">
          <button class="mini-btn human" id="btnHuman">🙋 转人工</button>
          <button class="mini-btn" id="btnRate">⭐ 评价</button>
        </div>
      </div>
      <div class="msgs" id="msgs"></div>
      <div class="composer">
        <div class="quick" id="quick">
          <button>如何申请退款？</button><button>查询订单物流</button><button>App 闪退怎么办</button><button>转人工</button>
        </div>
        <div class="input-row">
          <textarea id="input" placeholder="输入您的问题，Enter 发送，Shift+Enter 换行…"></textarea>
          <button class="send-btn" id="send">➤</button>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- ========== 管理视图 ========== -->
<div class="view" id="view-admin">
  <div class="admin"><div class="admin-inner">
    <h2>📊 数据概览</h2>
    <div class="sub" id="adminSub">客服运营实时统计 · 数据存储于云端</div>
    <div class="stat-grid" id="statGrid"><div class="loading">加载中…</div></div>
    <div class="two-col">
      <div class="panel"><h3>🎯 意图分布</h3><div id="intentBars"></div></div>
      <div class="panel"><h3>⭐ 满意度分布</h3><div id="ratingBars"></div></div>
    </div>
    <div class="panel">
      <h3>💬 对话记录 <span style="font-size:12px;color:var(--sub);font-weight:400">（点击查看完整对话）</span></h3>
      <div style="overflow:auto"><table class="tbl">
        <thead><tr><th>会话标题</th><th>访客</th><th>意图</th><th>消息数</th><th>状态</th><th>评分</th><th>更新时间</th><th></th></tr></thead>
        <tbody id="convTable"></tbody>
      </table></div>
    </div>
    <div class="panel">
      <h3>📚 FAQ 知识库管理</h3>
      <div class="faq-toolbar">
        <input id="faqQ" placeholder="问题" style="flex:2;min-width:180px">
        <input id="faqA" placeholder="答案" style="flex:3;min-width:200px">
        <select id="faqCat"><option value="refund">退款</option><option value="order">订单</option><option value="tech">技术</option><option value="general">通用</option></select>
        <button class="btn-solid" id="faqAdd">＋ 添加</button>
      </div>
      <div id="faqList"></div>
    </div>
  </div></div>
</div>

<!-- 会话详情弹框 -->
<div class="mask" id="detailMask"><div class="modal">
  <div class="modal-h"><b id="detailTitle">对话详情</b><span class="x" data-close>✕</span></div>
  <div class="modal-b" id="detailBody"></div>
</div></div>

<!-- 评价弹框 -->
<div class="mask" id="rateMask"><div class="modal" style="max-width:420px">
  <div class="modal-h"><b>为本次服务评分</b><span class="x" data-close>✕</span></div>
  <div class="modal-b" style="text-align:center">
    <div style="font-size:14px;color:var(--sub);margin-bottom:14px">您的反馈是我们进步的动力～</div>
    <div class="stars" id="rateStars" style="justify-content:center">
      <span class="star" data-s="1">★</span><span class="star" data-s="2">★</span><span class="star" data-s="3">★</span><span class="star" data-s="4">★</span><span class="star" data-s="5">★</span>
    </div>
    <div class="field" style="margin-top:18px;text-align:left"><label>补充评价（选填）</label><textarea id="rateComment" placeholder="说说您的感受…"></textarea></div>
  </div>
  <div class="modal-f"><button class="mini-btn" data-close>取消</button><button class="btn-solid" id="rateSubmit">提交评价</button></div>
</div></div>

<div class="toast" id="toast"></div>

<script>
/* ============ 全局状态 ============ */
const API = "/api";
const S = {
  visitor: localStorage.getItem("csa_visitor") || (()=>{const v="v_"+Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem("csa_visitor",v);return v})(),
  convId: null, conversations: [], messages: [], rating: null, sending: false,
};
const $ = id => document.getElementById(id);
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = ts => { if(!ts) return ""; const d=new Date(ts); return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}` };
function toast(msg){const t=$("toast");t.textContent=msg;t.classList.add("on");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("on"),2200)}
async function api(path,opt={}){
  try{
    const r=await fetch(API+path,{headers:{"Content-Type":"application/json"},...opt});
    const j=await r.json();
    if(!r.ok||j.ok===false) throw new Error(j.error||"请求失败");
    return j;
  }catch(e){ $("cloudDot").classList.remove("on"); throw e; }
}

/* ============ 视图切换 ============ */
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));
  document.querySelectorAll(".view").forEach(x=>x.classList.remove("on"));
  t.classList.add("on");$("view-"+t.dataset.view).classList.add("on");
  if(t.dataset.view==="admin") loadAdmin();
});

/* ============ 会话列表 ============ */
async function loadConversations(){
  $("convList").innerHTML='<div class="loading">加载中…</div>';
  try{
    const j=await api("/conversations?visitor="+encodeURIComponent(S.visitor));
    $("cloudDot").classList.add("on");
    S.conversations=j.conversations;
    renderConvList();
    if(S.conversations.length && !S.convId) openConv(S.conversations[0].id);
    else if(!S.conversations.length) createConv(true);
  }catch(e){ $("convList").innerHTML='<div class="empty">云端连接失败<br><span style="font-size:12px">请检查网络后刷新</span></div>'; }
}
function renderConvList(){
  if(!S.conversations.length){$("convList").innerHTML='<div class="empty">还没有咨询记录</div>';return}
  $("convList").innerHTML=S.conversations.map(c=>{
    const badge=c.status==="transferred"?'<span class="badge transfer">人工</span>':(c.intent&&c.intent!=="other"?`<span class="badge other">${intentName(c.intent)}</span>`:"");
    return `<div class="conv-item ${c.id===S.convId?"on":""}" data-id="${c.id}">
      <div class="t">${badge}${esc(c.title||"新咨询")}</div>
      <div class="m">${fmt(c.updated)} · ${c.status==="transferred"?"已转人工":"智能客服"}</div></div>`;
  }).join("");
  document.querySelectorAll(".conv-item").forEach(el=>el.onclick=()=>openConv(el.dataset.id));
}
function intentName(i){return {refund:"退款",order:"订单",tech:"技术",other:"其他"}[i]||i}

async function createConv(silent){
  try{
    const j=await api("/conversations",{method:"POST",body:JSON.stringify({visitor:S.visitor,title:"新咨询"})});
    S.convId=j.id;await loadConversations();openConv(j.id);
    if(!silent) toast("已创建新会话");
  }catch(e){toast("创建失败："+e.message)}
}
async function openConv(id){
  S.convId=id;renderConvList();
  $("msgs").innerHTML='<div class="loading">加载消息…</div>';
  try{
    const j=await api("/messages?conv="+encodeURIComponent(id));
    S.messages=j.messages;S.rating=j.rating;
    renderMessages();
  }catch(e){$("msgs").innerHTML='<div class="empty">加载失败</div>'}
}
function renderMessages(){
  if(!S.messages.length){$("msgs").innerHTML='<div class="empty">开始咨询吧～</div>';return}
  $("msgs").innerHTML=S.messages.map(m=>{
    if(m.role==="system") return `<div class="msg system"><div class="bubble">${esc(m.content)}</div></div>`;
    const isU=m.role==="user";
    const tag=m.intent&&m.intent!=="other"&&isU?`<span class="tag-intent">${intentName(m.intent)}</span>`:"";
    return `<div class="msg ${isU?"user":"bot"}">
      <div class="mava">${isU?"🙂":"🐱"}</div>
      <div><div class="bubble">${esc(m.content)}</div>
      <div class="meta">${tag}<span>${fmt(m.created)}</span>${m.source==="transfer"?'<span style="color:#E8853B">已转人工</span>':""}</div></div>
    </div>`;
  }).join("") + rateCardHTML();
  scrollBottom();
}
function rateCardHTML(){
  if(S.rating) return `<div class="rate-card"><div class="rate-done">✅ 您已评分 ${"★".repeat(S.rating.score)}${"☆".repeat(5-S.rating.score)} 感谢反馈！</div></div>`;
  return "";
}
function scrollBottom(){const m=$("msgs");m.scrollTop=m.scrollHeight}

/* ============ 发消息 ============ */
async function send(text){
  if(S.sending||!text.trim()||!S.convId) return;
  S.sending=true;$("send").disabled=true;
  const userMsg={id:"tmp_"+Date.now(),role:"user",content:text.trim(),intent:"",source:"",created:Date.now()};
  S.messages.push(userMsg);renderMessages();
  $("input").value="";
  // typing
  $("msgs").insertAdjacentHTML("beforeend",`<div class="msg bot" id="typing"><div class="mava">🐱</div><div><div class="bubble"><span class="typing"><i></i><i></i><i></i></span></div></div></div>`);
  scrollBottom();
  try{
    const j=await api("/chat",{method:"POST",body:JSON.stringify({conv:S.convId,text:text.trim()})});
    $("typing")?.remove();
    S.messages[S.messages.length-1].intent=j.intent;
    S.messages.push({id:"a_"+Date.now(),role:"agent",content:j.reply,intent:j.intent,source:j.source,created:Date.now()});
    renderMessages();
    if(j.transferred) toast("已为您转接人工客服");
    loadConversations();
  }catch(e){ $("typing")?.remove();toast("发送失败："+e.message) }
  finally{ S.sending=false;$("send").disabled=false;$("input").focus() }
}
$("send").onclick=()=>send($("input").value);
$("input").onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send($("input").value)}};
document.querySelectorAll("#quick button").forEach(b=>b.onclick=()=>send(b.textContent));
$("newConv").onclick=()=>createConv(false);
$("btnHuman").onclick=async()=>{ if(!S.convId)return; try{await api("/transfer",{method:"POST",body:JSON.stringify({conv:S.convId})});toast("已转人工，请稍候");openConv(S.convId);loadConversations()}catch(e){toast(e.message)} };
$("btnRate").onclick=()=>{ if(!S.convId)return toast("请先选择一个会话");$("rateMask").classList.add("on");selStars(0) };

/* ============ 评价 ============ */
let selScore=0;
function selStars(n){selScore=n;document.querySelectorAll("#rateStars .star").forEach(s=>s.classList.toggle("on",+s.dataset.s<=n))}
document.querySelectorAll("#rateStars .star").forEach(s=>s.onclick=()=>selStars(+s.dataset.s));
$("rateSubmit").onclick=async()=>{
  if(!selScore)return toast("请选择星级");
  try{
    await api("/rating",{method:"POST",body:JSON.stringify({conv:S.convId,score:selScore,comment:$("rateComment").value})});
    $("rateMask").classList.remove("on");toast("评价成功，感谢您的反馈！");openConv(S.convId);
  }catch(e){toast(e.message)}
};

/* ============ 管理后台 ============ */
async function loadAdmin(){ await Promise.all([loadStats(),loadAdminConvs(),loadFaqs()]) }
async function loadStats(){
  try{
    const j=await api("/admin/stats");
    $("cloudDot").classList.add("on");
    const escRate=j.ratingCount?`${j.avgRating} <small>/ 5 · ${j.ratingCount}份</small>`:'—';
    $("statGrid").innerHTML=`
      <div class="stat"><div class="label">💬 总会话数</div><div class="num">${j.totalConversations}</div></div>
      <div class="stat"><div class="label">✉️ 消息总数</div><div class="num">${j.totalMessages}</div></div>
      <div class="stat"><div class="label">🙋 转人工数</div><div class="num">${j.transferred}</div></div>
      <div class="stat"><div class="label">⭐ 平均满意度</div><div class="num">${escRate}</div></div>`;
    // 意图分布
    const imax=Math.max(1,...j.intents.map(x=>x.n));
    $("intentBars").innerHTML=j.intents.length?j.intents.map(x=>`<div class="bar-row"><span class="bl">${intentName(x.intent)}</span><div class="bar-track"><div class="bar-fill" style="width:${x.n/imax*100}%"></div></div><span class="bn">${x.n}</span></div>`).join(""):'<div class="empty">暂无数据</div>';
    // 满意度分布
    const rmax=Math.max(1,...j.ratingDist.map(x=>x.n));
    const totalR=j.ratingDist.reduce((a,b)=>a+b.n,0);
    $("ratingBars").innerHTML=j.ratingDist.length?j.ratingDist.map(x=>`<div class="bar-row"><span class="bl stars-mini">${"★".repeat(x.score)}</span><div class="bar-track"><div class="bar-fill" style="width:${x.n/rmax*100}%"></div></div><span class="bn">${x.n}</span></div>`).join(""):'<div class="empty">暂无评价</div>';
  }catch(e){$("statGrid").innerHTML='<div class="empty">统计加载失败</div>'}
}
async function loadAdminConvs(){
  try{
    const j=await api("/admin/conversations?limit=100");
    $("convTable").innerHTML=j.conversations.length?j.conversations.map(c=>{
      const st=c.status==="transferred"?'<span class="pill t">已转人工</span>':(c.status==="closed"?'<span class="pill">已关闭</span>':'<span class="pill o">进行中</span>');
      const sc=c.score?`<span class="stars-mini">${"★".repeat(c.score)}</span>`:'<span style="color:#ccc">—</span>';
      return `<tr><td class="ttl">${esc(c.title||"新咨询")}</td><td>${esc(String(c.visitor).slice(0,12))}</td>
        <td><span class="pill">${intentName(c.intent)}</span></td><td>${c.msg_count}</td><td>${st}</td><td>${sc}</td>
        <td>${fmt(c.updated)}</td><td><span class="link" data-detail="${c.id}">查看</span></td></tr>`;
    }).join(""):'<tr><td colspan="8" class="empty">暂无对话记录</td></tr>';
    document.querySelectorAll("[data-detail]").forEach(el=>el.onclick=()=>openDetail(el.dataset.detail));
  }catch(e){$("convTable").innerHTML='<tr><td colspan="8" class="empty">加载失败</td></tr>'}
}
async function openDetail(id){
  try{
    const j=await api("/messages?conv="+encodeURIComponent(id));
    $("detailTitle").textContent=j.conversation.title||"对话详情";
    const status=j.conversation.status==="transferred"?'<span class="pill t">已转人工</span>':'<span class="pill o">智能客服</span>';
    let html=`<div style="margin-bottom:14px;display:flex;gap:10px;align-items:center">${status}<span style="color:var(--sub);font-size:12px">访客 ${esc(j.conversation.visitor)} · ${fmt(j.conversation.created)}</span></div>`;
    html+=j.messages.map(m=>{
      const who=m.role==="user"?'<span class="who u">🙂 访客</span>':m.role==="agent"?'<span class="who a">🐱 小蜜'+(m.source==="faq"?" · FAQ":m.source==="transfer"?" · 转人工":"")+'</span>':'<span class="who s">系统</span>';
      return `<div class="msg-line">${who}<div class="txt">${esc(m.content)}</div></div>`;
    }).join("");
    if(j.rating) html+=`<div style="margin-top:14px;padding:12px;background:var(--coral-l);border-radius:10px">⭐ 满意度：<span class="stars-mini">${"★".repeat(j.rating.score)}${"☆".repeat(5-j.rating.score)}</span>${j.rating.comment?" · "+esc(j.rating.comment):""}</div>`;
    $("detailBody").innerHTML=html;
    $("detailMask").classList.add("on");
  }catch(e){toast(e.message)}
}
async function loadFaqs(){
  try{
    const j=await api("/faqs");
    $("faqList").innerHTML=j.faqs.length?j.faqs.map(f=>`<div class="faq-item" data-faq="${f.id}">
      <div class="fbody"><div class="fq"><span class="pill">${catName(f.category)}</span> ${esc(f.question)} <span style="font-size:11px;color:#bbb">命中 ${f.hits||0} 次</span></div><div class="fa">${esc(f.answer)}</div></div>
      <div class="fa-actions"><button class="icon-btn del" data-del="${f.id}">删除</button></div></div>`).join(""):'<div class="empty">暂无 FAQ</div>';
    document.querySelectorAll("[data-del]").forEach(el=>el.onclick=async()=>{
      if(!confirm("确定删除这条 FAQ？"))return;
      try{await api("/admin/faq/"+el.dataset.del,{method:"DELETE"});toast("已删除");loadFaqs()}catch(e){toast(e.message)}
    });
  }catch(e){$("faqList").innerHTML='<div class="empty">加载失败</div>'}
}
function catName(c){return {refund:"退款",order:"订单",tech:"技术",general:"通用"}[c]||c}
$("faqAdd").onclick=async()=>{
  const q=$("faqQ").value.trim(),a=$("faqA").value.trim(),c=$("faqCat").value;
  if(!q||!a)return toast("请填写问题和答案");
  // 关键词：从问题中提取 2 字以上的片段简单生成
  const kw=[...new Set((q.match(/[\u4e00-\u9fa5]{2,4}/g)||[]).slice(0,6))];
  try{
    await api("/admin/faq",{method:"POST",body:JSON.stringify({question:q,answer:a,category:c,keywords:kw})});
    $("faqQ").value="";$("faqA").value="";toast("FAQ 已添加");loadFaqs();
  }catch(e){toast(e.message)}
};

/* ============ 弹框关闭 ============ */
document.querySelectorAll("[data-close]").forEach(el=>el.onclick=()=>el.closest(".mask").classList.remove("on"));
document.querySelectorAll(".mask").forEach(m=>m.onclick=e=>{if(e.target===m)m.classList.remove("on")});

/* ============ 启动 ============ */
loadConversations();
</script>
